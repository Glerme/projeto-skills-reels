<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #cfe3f2; }
      #root { position: relative; width: 100%; height: 100%; }
      #root canvas, #flash { position: absolute; inset: 0; width: 100%; height: 100%; }
      #flash { background: #ffffff; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- data-duration = TOTAL / FPS from src/story.ts (2025 / 30 for the bridge) -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="67.5" data-width="1080" data-height="1920">
      <canvas id="base"></canvas>
      <canvas id="over"></canvas>
      <div id="flash"></div>
      <audio id="mix" class="clip" src="assets/mix.wav" data-start="0" data-duration="67.5" data-track-index="1"></audio>
    </div>
    <!-- three.js world, drawn on hf-seek (built from src/main.ts by `npm run build`) -->
    <script type="module" src="lib/bridge.js"></script>
    <script>
      // the picture is drawn by lib/bridge.js; this empty timeline only gives the root its clock
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
