<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d1430; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden;
        background: radial-gradient(ellipse 120% 70% at 50% 35%, #1f2c5c 0%, #141d42 55%, #0b112a 100%); }
      #scene { position: absolute; inset: 0; }
    </style>
    <script>
      // modo 2d: scene.html adiciona tweens em `tl`; tempos da fala com W(i) e at("palavra", n)
      window.WORDS = {{WORDS}};
      const tl = gsap.timeline({ paused: true });
      window.tl = tl;
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
      window.W = (i) => WORDS[i].start;
      window.at = (word, n = 1) => {
        const k = norm(word);
        const hits = WORDS.filter((w) => norm(w.text) === k);
        if (!hits[n - 1]) throw new Error(`at("${word}", ${n}): palavra não está no words.json`);
        return hits[n - 1].start;
      };
    </script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1080" data-height="1920">
      <div id="scene">
{{SCENE}}
      </div>
      {{CAPTIONS_HOST}}
      <audio id="mix" class="clip" src="assets/mix.wav" data-start="0" data-duration="{{DURATION}}" data-track-index="1"></audio>
    </div>
    <script>
      tl.set({}, {}, {{DURATION}});
      tl.seek(0);
    </script>
  </body>
</html>
