<svg id="art" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"
  style="position:absolute;inset:0;font-family:'DejaVu Sans','Liberation Sans',sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="hot"><stop offset="0" stop-color="#ffb347" stop-opacity=".9"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2350"/><stop offset="1" stop-color="#2d3b78"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd257"/><stop offset="1" stop-color="#d9930f"/></linearGradient>
  </defs>
  <g id="stars"></g>
  <g id="cam"></g>
</svg>
<script>
(() => {
  // ---------- base ----------
  const NS = "http://www.w3.org/2000/svg";
  const cam = document.getElementById("cam");
  const E = (tag, a = {}, p = cam) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
  const G = (p, a = {}) => E("g", a, p);
  const H = (p, s) => { p.insertAdjacentHTML("beforeend", s); return p.lastElementChild; };
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const C = { metal: "#c9d1e3", metalSh: "#8f9ab5", edge: "#5b6688", water: "#4aa8ff", air: "#7fb8e8", gold: "#f5b82e",
    red: "#ff4d4d", ok: "#2ee6a0", truck: "#ef4b3c", glass: "#8fd3ff", road: "#2a3566", pipe: "#3a4675", shoe: "#efe3b8", dark: "#141d42" };
  const END = 88.26;

  // ---------- estrelas (fundo, fora da câmera) ----------
  const stars = document.getElementById("stars");
  for (let i = 0; i < 70; i++) E("circle", { cx: rnd() * 1080, cy: rnd() * 1300, r: 1 + rnd() * 1.6, fill: "#cfd8ff", opacity: .12 + rnd() * .25 }, stars);
  tl.to(stars, { y: -60, duration: END, ease: "none" }, 0);

  // ---------- helpers de animação ----------
  const set = (t, a) => gsap.set(t, a);
  const pop = (g, t, d = .25) => { set(g, { opacity: 0, scale: .6, transformOrigin: "50% 50%" }); tl.to(g, { opacity: 1, scale: 1, duration: d, ease: "back.out(2.2)" }, t); };
  const fadeIn = (g, t, d = .4) => { set(g, { opacity: 0 }); tl.to(g, { opacity: 1, duration: d }, t); };
  const fadeOut = (g, t, d = .3) => tl.to(g, { opacity: 0, duration: d }, t);
  const blocks = [];
  // bloco = um desenho; entra e sai em crossfade de 0,4 s
  const block = (t0, t1, more = []) => {
    const g = G(cam); set(g, { opacity: 0 });
    for (const [a, z] of [[t0, t1], ...more]) {
      if (a === 0) set(g, { opacity: 1 }); else tl.to(g, { opacity: 1, duration: .4, ease: "power1.out" }, a - .2);
      if (z < END) tl.to(g, { opacity: 0, duration: .4, ease: "power1.in" }, z - .2);
    }
    blocks.push(t0); return g;
  };
  const arcPath = (cx, cy, r, a0, a1) => {
    const p = (a) => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)];
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  };
  // etiqueta: pílula escura, caixa alta; linha de chamada opcional até (tx,ty)
  const label = (p, x, y, text, color = "#fff", tx, ty, t) => {
    const g = G(p);
    if (tx !== undefined) {
      const ln = E("line", { x1: x, y1: y, x2: tx, y2: ty, stroke: "#fff", "stroke-width": 2, opacity: .8 }, g);
      const L = Math.hypot(tx - x, ty - y);
      set(ln, { attr: { "stroke-dasharray": L, "stroke-dashoffset": L } });
      if (t !== undefined) tl.to(ln, { attr: { "stroke-dashoffset": 0 }, duration: .35, ease: "power2.out" }, t + .12);
      const dot = E("circle", { cx: tx, cy: ty, r: 5, fill: "#fff" }, g);
      if (t !== undefined) { set(dot, { opacity: 0 }); tl.to(dot, { opacity: 1, duration: .1 }, t + .4); }
    }
    const w = text.length * 21.5 + 48;
    const pill = G(g);
    E("rect", { x: x - w / 2, y: y - 26, width: w, height: 52, rx: 26, fill: "#0d1430", opacity: .78 }, pill);
    const tx_ = E("text", { x: x + 1.5, y: y + 9.5, "text-anchor": "middle", fill: color, "font-size": 26, "font-weight": 800, "letter-spacing": "3.1" }, pill);
    tx_.textContent = text;
    if (t !== undefined) pop(pill, t);
    return g;
  };
  // tubo com fluido que corre (dasharray)
  const pipe = (p, d, w = 16) => {
    const base = E("path", { d, fill: "none", stroke: C.pipe, "stroke-width": w + 8, "stroke-linecap": "round", "stroke-linejoin": "round" }, p);
    const fl = E("path", { d, fill: "none", stroke: C.water, "stroke-width": w, "stroke-linecap": "round", "stroke-linejoin": "round" }, p);
    const L = fl.getTotalLength();
    set(fl, { attr: { "stroke-dasharray": L + 2, "stroke-dashoffset": L + 2 } });
    return { base, fl, L, fill: (t, dur = .6, color) => { if (color) set(fl, { attr: { stroke: color } }); tl.to(fl, { attr: { "stroke-dashoffset": 0 }, duration: dur, ease: "none" }, t); },
      full: (color) => set(fl, { attr: { "stroke-dashoffset": 0, ...(color ? { stroke: color } : {}) } }),
      drain: (t, dur = .6) => tl.to(fl, { attr: { "stroke-dashoffset": -(L + 2) }, duration: dur, ease: "none" }, t) };
  };
  // pontinhos brancos andando dentro do tubo = ar correndo
  const airFlow = (p, d, t0, t1, speed = 1) => {
    const f = E("path", { d, fill: "none", stroke: "#fff", "stroke-width": 4, "stroke-linecap": "round", "stroke-dasharray": "2 16", opacity: 0 }, p);
    tl.to(f, { opacity: .7, duration: .2 }, t0);
    tl.to(f, { attr: { "stroke-dashoffset": -90 * (t1 - t0) * speed }, duration: t1 - t0, ease: "none" }, t0);
    tl.to(f, { opacity: 0, duration: .3 }, t1);
    return f;
  };
  const puffs = (p, x, y, t, n = 6, dx = 1, dy = -0.4, size = 1) => {
    for (let i = 0; i < n; i++) {
      const c = E("circle", { cx: x, cy: y, r: 10 * size, fill: "#e8ecf5", opacity: 0 }, p);
      const tt = t + i * .12;
      tl.set(c, { opacity: .85 }, tt);
      tl.to(c, { x: (60 + rnd() * 80) * dx * size, y: (60 + rnd() * 60) * dy * size + (rnd() - .5) * 40, scale: 2.4 + rnd(), opacity: 0, transformOrigin: "50% 50%", duration: .9, ease: "power2.out" }, tt);
    }
  };
  const drops = (p, x, y, t0, t1) => {
    for (let t = t0; t < t1; t += .28) {
      const d = H(p, `<path d="M${x} ${y - 10} q 9 12 0 20 q -9 -8 0 -20z" fill="${C.water}" opacity="0"/>`);
      tl.set(d, { opacity: 1, x: (rnd() - .5) * 14, y: 0 }, t);
      tl.to(d, { y: 240, opacity: 0, duration: .8, ease: "power2.in" }, t);
    }
  };
  const tank = (p, x, y, w, h, lbl) => {
    const g = G(p, { filter: "url(#sh)" });
    E("rect", { x, y, width: w, height: h, rx: h / 2, fill: "#24306a", stroke: "#5b8fc0", "stroke-width": 5 }, g);
    const fill = E("rect", { x: x + 4, y: y + 4, width: w - 8, height: h - 8, rx: (h - 8) / 2, fill: C.air }, g);
    const dots = G(g);
    for (let i = 0; i < Math.round(w * h / 900); i++) E("circle", { cx: x + 16 + rnd() * (w - 32), cy: y + 10 + rnd() * (h - 20), r: 1.4 + rnd() * 1.4, fill: "#fff", opacity: .75 }, dots);
    const level = (v, t, dur = .8) => tl.to([fill, dots], { opacity: v, duration: dur, ease: "power1.inOut" }, t);
    set([fill, dots], { opacity: .15 });
    return { g, fill, dots, level, now: (v) => set([fill, dots], { opacity: v }) };
  };
  const gauge = (p, x, y, r, txt = "PRESSÃO", v0 = 0) => {
    const g = G(p);
    E("path", { d: arcPath(x, y, r, 150, 390), fill: "none", stroke: "#2b3664", "stroke-width": r * .16, "stroke-linecap": "round" }, g);
    const arc = E("path", { d: arcPath(x, y, r, 150, 390), fill: "none", stroke: C.ok, "stroke-width": r * .16, "stroke-linecap": "round" }, g);
    const L = arc.getTotalLength();
    for (let i = 0; i <= 8; i++) { const a = (150 + 30 * i) * Math.PI / 180; E("line", { x1: x + Math.cos(a) * r * .68, y1: y + Math.sin(a) * r * .68, x2: x + Math.cos(a) * r * .8, y2: y + Math.sin(a) * r * .8, stroke: "#5b6688", "stroke-width": 3 }, g); }
    const nd = G(g);
    E("line", { x1: x, y1: y, x2: x + r * .78, y2: y, stroke: "#fff", "stroke-width": r * .06, "stroke-linecap": "round" }, nd);
    E("circle", { cx: x, cy: y, r: r * .1, fill: "#fff" }, g);
    const tt = E("text", { x, y: y + r * .62, "text-anchor": "middle", fill: "#fff", "font-size": Math.max(18, r * .2), "font-weight": 800, "letter-spacing": 3 }, g); tt.textContent = txt;
    const st = (v) => ({ rotation: 150 + 240 * v, svgOrigin: `${x} ${y}` });
    set(nd, st(v0)); set(arc, { attr: { "stroke-dasharray": L, "stroke-dashoffset": L * (1 - v0) } });
    return { g, arc, to: (v, t, dur = .8, color) => {
      tl.to(nd, { ...st(v), duration: dur, ease: "power2.inOut" }, t);
      tl.to(arc, { attr: { "stroke-dashoffset": L * (1 - v), ...(color ? { stroke: color } : {}) }, duration: dur, ease: "power2.inOut" }, t);
    }, now: (v, color) => { set(nd, st(v)); set(arc, { attr: { "stroke-dashoffset": L * (1 - v), ...(color ? { stroke: color } : {}) } }); } };
  };
  // roda de tambor: aro que gira, sapatas que apertam
  const wheel = (p, x, y, r) => {
    const g = G(p, { filter: "url(#sh)" });
    const glow = E("circle", { cx: x, cy: y, r: r * .62, fill: "url(#hot)", opacity: 0 }, g);
    const spin = G(g);
    E("circle", { cx: x, cy: y, r: r, fill: "#2b3560", stroke: C.metalSh, "stroke-width": r * .07 }, spin);
    for (let i = 0; i < 12; i++) { const a = i * 30 * Math.PI / 180; E("line", { x1: x + Math.cos(a) * r * .88, y1: y + Math.sin(a) * r * .88, x2: x + Math.cos(a) * r * 1.02, y2: y + Math.sin(a) * r * 1.02, stroke: "#5b6688", "stroke-width": 5 }, spin); }
    E("circle", { cx: x, cy: y, r: r * .8, fill: C.dark, stroke: "#4a5683", "stroke-width": 4 }, spin);
    E("circle", { cx: x + r * .55, cy: y, r: r * .05, fill: "#4a5683" }, spin);
    E("circle", { cx: x - r * .55, cy: y, r: r * .05, fill: "#4a5683" }, spin);
    const shoes = G(g);
    const sw = r * .12, sr = r * .58;
    E("path", { d: arcPath(x, y, sr, 115, 245), fill: "none", stroke: C.shoe, "stroke-width": sw, "stroke-linecap": "round" }, shoes);
    E("path", { d: arcPath(x, y, sr, -65, 65), fill: "none", stroke: C.shoe, "stroke-width": sw, "stroke-linecap": "round" }, shoes);
    const cam_ = E("ellipse", { cx: x, cy: y - r * .58, rx: r * .14, ry: r * .07, fill: C.gold }, g);
    E("circle", { cx: x, cy: y, r: r * .12, fill: "#cfd6ea" }, g);
    set(spin, { svgOrigin: `${x} ${y}` }); set(shoes, { svgOrigin: `${x} ${y}` });
    return { g, x, y, r, top: y - r * .58,
      spin: (t0, t1, turns, ease = "none") => tl.to(spin, { rotation: `+=${360 * turns}`, svgOrigin: `${x} ${y}`, duration: t1 - t0, ease }, t0),
      brake: (t, on = true, d = .3) => {
        tl.to(shoes.children, { attr: { stroke: on ? "#ffa726" : C.shoe }, duration: d }, t);
        tl.to(shoes, { scale: on ? 1.14 : 1, svgOrigin: `${x} ${y}`, duration: d, ease: on ? "back.out(3)" : "power2.out" }, t);
        tl.to(glow, { opacity: on ? 1 : 0, duration: d + .2 }, t);
      },
      braked: () => { set(shoes.children, { attr: { stroke: "#ffa726" } }); set(shoes, { scale: 1.14, svgOrigin: `${x} ${y}` }); set(glow, { opacity: 1 }); } };
  };
  const springPath = (x0, x1, cy, h, n = 9) => {
    let d = `M${x0} ${cy}`; const step = (x1 - x0) / (n * 2);
    for (let i = 0; i < n * 2; i++) d += ` L${(x0 + step * (i + .5)).toFixed(1)} ${cy + (i % 2 ? h / 2 : -h / 2)}`;
    return d + ` L${x1} ${cy}`;
  };
  // câmara de mola: mola à esquerda, placa vermelha, ar à direita, haste para fora
  const springChamber = (p, x, y, w, h, rodLen, state = "braked") => {
    const g = G(p, { filter: "url(#sh)" });
    const cy = y + h / 2, inL = x + 16, inR = x + w - 16;
    const pB = x + w * .76, pR = x + w * .36;
    E("rect", { x, y, width: w, height: h, rx: 22, fill: "#1a2350", stroke: C.metalSh, "stroke-width": 7 }, g);
    const air = E("rect", { x: pB + 8, y: y + 12, width: inR - pB - 8, height: h - 24, rx: 6, fill: C.air, opacity: 0 }, g);
    const airDots = G(g);
    for (let i = 0; i < 26; i++) E("circle", { cx: pR + 14 + rnd() * (inR - pR - 26), cy: y + 18 + rnd() * (h - 36), r: 1.6 + rnd(), fill: "#fff", opacity: .7 }, airDots);
    const airClip = E("clipPath", { id: "ac" + Math.round(x) + Math.round(y) }, g);
    const clipR = E("rect", { x: pB + 8, y: y + 12, width: inR - pB - 8, height: h - 24 }, airClip);
    airDots.setAttribute("clip-path", `url(#${airClip.id})`);
    const spring = E("path", { d: springPath(inL, pB - 6, cy, h * .66), fill: "none", stroke: C.gold, "stroke-width": Math.max(5, h * .055), "stroke-linejoin": "round" }, g);
    const plate = G(g);
    E("rect", { x: pB - 7, y: y + 10, width: 14, height: h - 20, rx: 4, fill: C.red }, plate);
    E("rect", { x: pB + 7, y: cy - h * .07, width: rodLen, height: h * .14, rx: 4, fill: "#dfe5f3" }, plate);
    E("rect", { x: inR - 2, y: cy - h * .1, width: 18, height: h * .2, fill: C.metalSh }, g);
    const S = (st) => {
      const pp = st === "braked" ? pB : pR;
      return { spring: { scaleX: (pp - 6 - inL) / (pB - 6 - inL), svgOrigin: `${inL} ${cy}` }, plate: { x: pp - pB },
        air: { attr: { x: pp + 8, width: inR - pp - 8 }, opacity: st === "braked" ? 0 : 1 }, clip: { attr: { x: pp + 8, width: inR - pp - 8 } },
        dots: { opacity: st === "braked" ? 0 : 1 } };
    };
    const now = (st) => { const s = S(st); set(spring, s.spring); set(plate, s.plate); set(air, s.air); set(clipR, s.clip); set(airDots, s.dots); };
    now(state);
    return { g, rodEnd: (st) => (st === "braked" ? pB : pR) + 7 + rodLen, cy, now,
      to: (st, t, d = .6, ease = "power2.inOut") => { const s = S(st);
        tl.to(spring, { ...s.spring, duration: d, ease: st === "braked" ? "back.out(1.6)" : ease }, t);
        tl.to(plate, { ...s.plate, duration: d, ease: st === "braked" ? "back.out(1.6)" : ease }, t);
        tl.to(air, { ...s.air, duration: d, ease }, t); tl.to(clipR, { ...s.clip, duration: d, ease }, t); tl.to(airDots, { ...s.dots, duration: d }, t); } };
  };
  // haste da câmara até o came da roda; acompanha a câmara
  const linkTo = (p, ch, st, wh) => {
    const ln = E("line", { x1: ch.rodEnd(st) - 8, y1: ch.cy, x2: wh.x, y2: wh.top, stroke: "#dfe5f3", "stroke-width": 9, "stroke-linecap": "round" }, p);
    return { to: (st2, t, d = .6) => tl.to(ln, { attr: { x1: ch.rodEnd(st2) - 8 }, duration: d, ease: st2 === "braked" ? "back.out(1.6)" : "power2.inOut" }, t),
      now: (st2) => set(ln, { attr: { x1: ch.rodEnd(st2) - 8 } }) };
  };
  // caminhão de lado, virado para a direita; rodas no chão em y 760
  const truck = (p, ox = 40) => {
    const g = G(p, { filter: "url(#sh)" }); set(g, { x: ox });
    const trailer = G(g), cab = G(g);
    E("rect", { x: 110, y: 560, width: 610, height: 160, rx: 10, fill: "#d3d9e8" }, trailer);
    E("rect", { x: 110, y: 560, width: 610, height: 18, rx: 8, fill: "#e8ecf5" }, trailer);
    for (let i = 0; i < 13; i++) E("rect", { x: 140 + i * 45, y: 582, width: 6, height: 128, rx: 3, fill: "#b4bdd3" }, trailer);
    E("rect", { x: 110, y: 718, width: 610, height: 14, fill: "#5b6688" }, trailer);
    E("rect", { x: 590, y: 730, width: 14, height: 30, fill: "#5b6688" }, trailer);
    const tw = [165, 222, 279].map((cx) => truckWheel(trailer, cx));
    E("rect", { x: 725, y: 512, width: 12, height: 90, rx: 5, fill: "#8f9ab5" }, cab);
    H(cab, `<path d="M742 590 h92 q30 0 38 30 l12 48 v62 h-142z" fill="${C.truck}"/>`);
    H(cab, `<path d="M812 604 h24 q18 0 23 20 l9 34 h-56z" fill="${C.glass}"/>`);
    E("rect", { x: 754, y: 606, width: 46, height: 52, rx: 6, fill: C.glass, opacity: .85 }, cab);
    E("rect", { x: 742, y: 700, width: 146, height: 16, rx: 4, fill: "#b8342a" }, cab);
    E("rect", { x: 870, y: 676, width: 18, height: 12, rx: 3, fill: "#ffe39a" }, cab);
    E("rect", { x: 700, y: 724, width: 60, height: 10, fill: "#5b6688" }, cab);
    const cw = [785, 852].map((cx) => truckWheel(cab, cx, 27));
    return { g, cab, trailer, wheels: [...tw, ...cw], tw, cw };
  };
  const truckWheel = (p, cx, r = 25) => {
    const g = G(p);
    E("circle", { cx, cy: 760 - r, r, fill: "#262c44" }, g);
    E("circle", { cx, cy: 760 - r, r: r * .5, fill: "#9aa5c0" }, g);
    for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; E("line", { x1: cx, y1: 760 - r, x2: cx + Math.cos(a) * r * .45, y2: 760 - r + Math.sin(a) * r * .45, stroke: "#5b6688", "stroke-width": 4 }, g); }
    set(g, { svgOrigin: `${cx} ${760 - r}` }); g._c = [cx, 760 - r];
    return g;
  };
  const roll = (ws, t0, t1, turns, ease = "none") => ws.forEach((w) => tl.to(w, { rotation: `+=${360 * turns}`, svgOrigin: `${w._c[0]} ${w._c[1]}`, duration: t1 - t0, ease }, t0));
  // mundo: cidade à noite, nuvens, estrada com faixa
  const world = (p) => {
    const back = G(p), city = G(back);
    for (let x = -300; x < 1500; x += 70 + rnd() * 40) {
      const w = 60 + rnd() * 50, h = 90 + rnd() * 170;
      E("rect", { x, y: 760 - h, width: w, height: h, fill: "#1a2350" }, city);
      for (let wy = 760 - h + 14; wy < 740; wy += 26) for (let wx = x + 10; wx < x + w - 12; wx += 18) if (rnd() > .55) E("rect", { x: wx, y: wy, width: 8, height: 11, fill: "#f2c86b", opacity: .55 + rnd() * .4 }, city);
    }
    const clouds = G(back);
    [[620, 520, 1.1], [980, 470, .9], [180, 470, .7], [1300, 500, 1]].forEach(([x, y, s]) =>
      H(clouds, `<g fill="#5d6a99" opacity=".9"><ellipse cx="${x}" cy="${y}" rx="${130 * s}" ry="${44 * s}"/><ellipse cx="${x - 60 * s}" cy="${y - 22 * s}" rx="${70 * s}" ry="${46 * s}"/><ellipse cx="${x + 50 * s}" cy="${y - 34 * s}" rx="${80 * s}" ry="${54 * s}"/></g>`));
    E("rect", { x: -400, y: 760, width: 1900, height: 1200, fill: C.road }, p);
    E("rect", { x: -400, y: 760, width: 1900, height: 8, fill: "#3b4782" }, p);
    const dash = E("line", { x1: -400, y1: 830, x2: 1500, y2: 830, stroke: "#e8ecf5", "stroke-width": 7, "stroke-dasharray": "46 40", opacity: .85 }, p);
    return { back, city, clouds, dash,
      drive: (t0, t1, speed = 1, ease = "none") => {
        tl.to(dash, { attr: { "stroke-dashoffset": 86 * 9 * (t1 - t0) * speed }, duration: t1 - t0, ease }, t0);
        tl.to(city, { x: `-=${40 * (t1 - t0) * speed}`, duration: t1 - t0, ease }, t0);
        tl.to(clouds, { x: `-=${14 * (t1 - t0) * speed}`, duration: t1 - t0, ease }, t0);
      } };
  };
  const arrow = (p, x, y, s = 1, color = C.gold) => H(p, `<path d="M${x - 40 * s} ${y - 7 * s} h${52 * s} v${-12 * s} l${26 * s} ${19 * s} l${-26 * s} ${19 * s} v${-12 * s} h${-52 * s}z" fill="${color}"/>`);
